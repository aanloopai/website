name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Volledige historie: scripts/build-sitemap.cjs leest de laatste
          # commitdatum per bronbestand voor <lastmod>. Met de standaard
          # depth=1 ziet git alleen de merge-commit en krijgt élke URL de
          # deploydatum — precies wat we niet willen.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --experimental-versions
          workingDirectory: '.'
