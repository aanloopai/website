name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Volledige historie: scripts/build-sitemap.cjs leest de laatste
          # commitdatum per bronbestand voor <lastmod>. Met de standaard
          # depth=1 ziet git alleen de merge-commit en krijgt élke URL de
          # deploydatum — precies wat we niet willen.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # IndexNow: bewaar de LIVE sitemap vóór de deploy; de ping na de deploy meldt alleen
      # nieuwe/gewijzigde URL's (lastmod-diff). Faalt dit, dan slaat de ping zichzelf over.
      - name: IndexNow - snapshot live sitemap
        continue-on-error: true
        run: curl -fsS --max-time 30 https://aanloopai.nl/sitemap.xml -o .indexnow-prev.xml

      - name: Build Astro site
        run: npm run build

      # Telegram-notificaties (owner-besluit 2026-09-10): elke inzending,
      # intake, betaling en demo landt op Telegram. De secrets leven in GitHub
      # (repo → Settings → Secrets) en worden hier naar de Worker gezet.
      # Deze Worker draait in "versions"-modus (versions upload hieronder);
      # een gewone `secret bulk` weigert dan (API-fout 10215, runs
      # 34463019974 + 34463350824). `versions secret bulk` is de
      # versions-bewuste variant: maakt een nieuwe versie met de secrets,
      # waarna de `versions upload` hieronder ze overerft.
      - name: Push Worker secrets (Telegram + AGA)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGA_TERMINAL_TOKEN: ${{ secrets.AGA_TERMINAL_TOKEN }}
        run: |
          node -e "require('fs').writeFileSync('.secrets.json', JSON.stringify({ TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID: process.env.TELEGRAM_CHAT_ID, AGA_TERMINAL_TOKEN: process.env.AGA_TERMINAL_TOKEN }))"
          npx --yes wrangler@4.130.0 versions secret bulk .secrets.json --message "telegram + aga secrets" --tag secrets
          rm -f .secrets.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --experimental-versions
          workingDirectory: '.'

      # IndexNow (Bing/Copilot/Yandex): pas pingen als de nieuwe sitemap echt live staat, anders
      # haalt de crawler nog oude pagina's op. De key is publiek (public/<key>.txt) - geen secret.
      # `versions upload` promoot niet altijd zelf; blijft live onveranderd, dan slaan we de ping
      # over (waarschuwing) in plaats van te pingen op niet-live content. Nooit build-brekend.
      - name: IndexNow - ping changed URLs (post-deploy)
        continue-on-error: true
        env:
          INDEXNOW_PING: '1'
        run: |
          for i in $(seq 1 20); do
            if [ "$(curl -fsS --max-time 30 "https://aanloopai.nl/sitemap.xml?ci=$GITHUB_RUN_ID-$i" | md5sum | cut -d' ' -f1)" = "$(md5sum dist/sitemap.xml | cut -d' ' -f1)" ]; then
              node scripts/indexnow-ping.cjs --prev .indexnow-prev.xml
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Live sitemap != dist/sitemap.xml after 5 min - IndexNow ping skipped"
