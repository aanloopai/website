name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Volledige historie: scripts/build-sitemap.cjs leest de laatste
          # commitdatum per bronbestand voor <lastmod>. Met de standaard
          # depth=1 ziet git alleen de merge-commit en krijgt élke URL de
          # deploydatum — precies wat we niet willen.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # Telegram-notificaties (owner-besluit 2026-09-10): elke inzending,
      # intake, betaling en demo landt op Telegram. De secrets leven in GitHub
      # (repo → Settings → Secrets) en worden hier naar de Worker gezet.
      # Deze Worker draait in "versions"-modus (versions upload hieronder);
      # een gewone `secret bulk` weigert dan (API-fout 10215, runs
      # 34463019974 + 34463350824). `versions secret bulk` is de
      # versions-bewuste variant: maakt een nieuwe versie met de secrets,
      # waarna de `versions upload` hieronder ze overerft.
      - name: Push Worker secrets (Telegram)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e "require('fs').writeFileSync('.secrets.json', JSON.stringify({ TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID: process.env.TELEGRAM_CHAT_ID }))"
          npx --yes wrangler@4.130.0 versions secret bulk .secrets.json --message "telegram secrets" --tag telegram
          rm -f .secrets.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --experimental-versions
          workingDirectory: '.'
