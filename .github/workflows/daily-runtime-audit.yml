name: Daily Runtime Audit

# Autonomous-agent V3 — daily browser-runtime audit (Playwright).
# Runt scripts/agent/audit-runtime.cjs tegen production aanloopai.nl.
# Catches JS-runtime regressies die V1 static-fetch audit mist (zoals ec1270d
# initGrowthBook ReferenceError die 2 weken onopgemerkt bleef).
# Opent een GitHub issue bij regressie (deduplicate via 'autonomous-runtime' label),
# of sluit de open runtime-audit issue als alle checks weer pass zijn.
# Loopt 1 uur na V1 (V1 = 04:00 UTC, V3 = 05:00 UTC) — als V1 al een schema/pricing
# issue opent, krijg je niet meteen ook een runtime-issue voor hetzelfde grondprobleem.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  runtime-audit:
    name: Runtime audit (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run runtime audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          node scripts/agent/audit-runtime.cjs > audit-runtime-output.txt 2>&1
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "--- Runtime audit output ---"
          cat audit-runtime-output.txt
          # Persist JSON summary (laatste JSON-blok in output) voor parsing
          node -e "const fs=require('fs');const t=fs.readFileSync('audit-runtime-output.txt','utf8');const m=t.match(/\{[\s\S]*\}\s*\$/);fs.writeFileSync('audit-runtime-summary.json',m?m[0]:'{}');"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-runtime-output
          path: |
            audit-runtime-output.txt
            audit-runtime-summary.json
          retention-days: 30

      - name: Open or update regression issue
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('audit-runtime-summary.json', 'utf8'));
            const output = fs.readFileSync('audit-runtime-output.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const title = `[auto] Runtime-audit regressie ${today}`;

            // Vermijd duplicate issues: zoek bestaand open issue met label autonomous-runtime
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'autonomous-runtime',
              per_page: 5,
            });

            const failureList = (summary.failures || []).map((f, i) =>
              `${i + 1}. **[${f.category}]** ${f.msg}`
            ).join('\n');

            const body = [
              `## Runtime-audit regressie gedetecteerd op ${today}`,
              ``,
              `**Target:** ${summary.base_url || 'https://aanloopai.nl'}`,
              `**Audit type:** ${summary.audit_type || 'runtime-v3'}`,
              `**Timestamp:** ${summary.timestamp || 'unknown'}`,
              `**Duration:** ${summary.duration_seconds || '?'}s`,
              `**Passes:** ${summary.pass_count || 0}, **Failures:** ${summary.fail_count || 0}`,
              ``,
              `### Regressies`,
              ``,
              failureList || '(geen detail)',
              ``,
              `### Volledige output`,
              ``,
              '```',
              output.slice(0, 5000),
              '```',
              ``,
              `---`,
              `_Dit issue is automatisch geopend door [.github/workflows/daily-runtime-audit.yml](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/master/.github/workflows/daily-runtime-audit.yml). Browser-runtime checks (console.error, pageerror, requestfailed, interactivity) op 7 critical URLs. V2 autonomous agent picks dit up voor triage en (indien scope toegestaan) fix-PR._`,
            ].join('\n');

            if (existing.data.length > 0) {
              const issueNumber = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `## Update ${today}\n\n${body.slice(body.indexOf('### Regressies'))}`,
              });
              console.log(`Comment toegevoegd aan bestaand issue #${issueNumber}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['autonomous-runtime', 'regression'],
              });
              console.log(`Nieuw issue geopend: #${created.data.number}`);
            }

      - name: Close audit issue if all checks pass
        if: steps.audit.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'autonomous-runtime',
              per_page: 10,
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## Resolved ${today}\n\nAlle runtime-checks pass — sluiten via auto-resolve.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Issue #${issue.number} gesloten — alle runtime-checks pass`);
            }

      - name: Fail job if regressies (after issue creation)
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
