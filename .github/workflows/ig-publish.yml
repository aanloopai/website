name: Instagram Auto-Publish

# Publishes the next due slot from marketing/instagram/wave-N-schedule.json
# to @aanloop.ai via Meta Graph API. Daily 09:00 + 17:00 CET cadence,
# DST-safe via dual cron entries (CEST 09:00 = 07:00 UTC, CET 09:00 = 08:00 UTC;
# CEST 17:00 = 15:00 UTC, CET 17:00 = 16:00 UTC).
# The publish script is idempotent: each slot has posted_at and won't re-fire.

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Graph API calls (preview only)'
        required: false
        default: 'false'
      validate_only:
        description: 'Token + Page identity check, no posting'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  publish:
    name: Publish next IG slot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ig-publish
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate schedule
        run: node scripts/validate-ig-schedule.mjs

      - name: Run IG publisher
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_CONNECTION_ID: ${{ secrets.COMPOSIO_CONNECTION_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          VALIDATE_ONLY: ${{ github.event.inputs.validate_only == 'true' && '1' || '' }}
        run: node scripts/ig-publish.mjs

      - name: Commit schedule update
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.validate_only != 'true' }}
        run: |
          if git diff --quiet marketing/instagram/wave-*-schedule.json; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "aanloop-ig-bot"
          git config user.email "bot@aanloopai.nl"
          git add marketing/instagram/wave-*-schedule.json
          git commit -m "chore(social): record IG publish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin master

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ig-publish-fail';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `IG publish workflow failed (run ${context.runId})`;
            const body = [
              `Run: ${runUrl}`,
              `Triggered by: ${context.eventName}`,
              `Branch: ${context.ref}`,
              ``,
              `Open the failed step ('Run IG publisher') for the verbose error JSON. Token/connection issues typically log as 'Composio POST .../execute HTTP 4xx'.`,
              ``,
              `Auto-opened by .github/workflows/ig-publish.yml`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failure again: ${runUrl}`,
              });
              core.info(`Commented on existing issue #${existing.data[0].number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Opened issue #${issue.data.number}`);
            }
