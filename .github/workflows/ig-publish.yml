name: Instagram Auto-Publish

# Publishes the next due slot from marketing/instagram/wave-N-schedule.json
# to @aanloop.ai via Meta Graph API (direct, v19.0). Runs Mon/Wed/Fri at
# 07:07 UTC (CEST 09:07) and at 08:07 UTC (CET 09:07) so cadence holds
# across DST. The publish script is idempotent: each slot has posted_at
# and won't re-fire.
# Migrated off Composio Rube on 2026-05-12 ahead of Rube EOL 2026-05-15.

on:
  schedule:
    - cron: '7 7 * * 1,3,5'
    - cron: '7 8 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Graph API calls (preview only)'
        required: false
        default: 'false'
      validate_only:
        description: 'Token + Page identity check, no posting'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  publish:
    name: Publish next IG slot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ig-publish
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate schedule
        run: node scripts/validate-ig-schedule.mjs

      - name: Run IG publisher
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          VALIDATE_ONLY: ${{ github.event.inputs.validate_only == 'true' && '1' || '' }}
        run: node scripts/ig-publish.mjs

      - name: Commit schedule update
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.validate_only != 'true' }}
        run: |
          if git diff --quiet marketing/instagram/wave-*-schedule.json; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "aanloop-ig-bot"
          git config user.email "bot@aanloopai.nl"
          git add marketing/instagram/wave-*-schedule.json
          git commit -m "chore(social): record IG publish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin master

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ig-publish-fail';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `IG publish workflow failed (run ${context.runId})`;
            const body = [
              `Run: ${runUrl}`,
              `Triggered by: ${context.eventName}`,
              `Branch: ${context.ref}`,
              ``,
              `Open the failed step ('Run IG publisher') for the verbose error JSON. Token issues typically log as 'Graph POST .../media HTTP 4xx' with an error.code/error.message. Container processing failures show as 'Container ... status=ERROR'.`,
              ``,
              `Auto-opened by .github/workflows/ig-publish.yml`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failure again: ${runUrl}`,
              });
              core.info(`Commented on existing issue #${existing.data[0].number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Opened issue #${issue.data.number}`);
            }
