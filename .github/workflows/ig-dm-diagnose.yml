name: IG DM Diagnose
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.104.100.94 >> ~/.ssh/known_hosts
      - name: Diagnose server
        run: |
          ssh -i ~/.ssh/id_ed25519 root@178.104.100.94 bash -s << 'ENDSSH'
          echo "=== service status ==="
          systemctl status aanloop-ig-dm --no-pager || true
          echo "=== service journal (last 30 lines) ==="
          journalctl -u aanloop-ig-dm -n 30 --no-pager || true
          echo "=== bot file exists ==="
          ls -la /opt/aanloop-ig-dm/scripts/ || echo "no scripts dir"
          echo "=== node_modules ==="
          ls /opt/aanloop-ig-dm/node_modules 2>/dev/null | head -5 || echo "no node_modules"
          echo "=== env file ==="
          ls -la /etc/aanloop-ig-dm.env || echo "no env file"
          echo "=== port 443 ==="
          ss -tlnp | grep 443 || echo "not on 443"
          echo "=== curl https health ==="
          curl -sk https://ig-dm.aanloopai.nl/health || echo "https not responding"
          ENDSSH
