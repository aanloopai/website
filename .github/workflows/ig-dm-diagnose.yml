name: IG DM Diagnose
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.104.100.94 >> ~/.ssh/known_hosts
      - name: Diagnose server
        run: |
          ssh -i ~/.ssh/id_ed25519 root@178.104.100.94 bash -s << 'ENDSSH'
          echo "=== nginx status ==="
          systemctl status nginx --no-pager || true
          echo "=== nginx -t ==="
          nginx -t 2>&1 || true
          echo "=== port 443 listening ==="
          ss -tlnp | grep 443 || echo "NOT listening on 443"
          echo "=== port 80 listening ==="
          ss -tlnp | grep ':80 ' || echo "NOT listening on 80"
          echo "=== UFW status ==="
          ufw status || true
          echo "=== iptables 443 ==="
          iptables -L INPUT -n | grep 443 || echo "no iptables rule for 443"
          echo "=== service status ==="
          systemctl status aanloop-ig-dm --no-pager || true
          echo "=== curl localhost ==="
          curl -s http://localhost:3030/health || echo "localhost:3030 not responding"
          echo "=== nginx sites-enabled ==="
          ls -la /etc/nginx/sites-enabled/ || true
          echo "=== nginx conf ==="
          cat /etc/nginx/sites-enabled/ig-dm.aanloopai.nl || true
          echo "=== certbot cert ==="
          ls -la /etc/letsencrypt/live/ig-dm.aanloopai.nl/ || echo "no cert"
          ENDSSH
