name: Weekly SEO Scorecard

# Wekelijks: bouwt de site en scoort de SEO health (scripts/seo-scorecard.cjs).
# Bij score < 100:
#   1. past veilige, deterministische auto-fixes toe (seo-autofix --apply) en
#      commit die naar master, daarna herscoren;
#   2. blijft het onder 100, dan wordt een GitHub-issue geopend/bijgewerkt
#      (label seo-regression) en faalt de job — regressie-alarm.
# Komt de score (terug) op 100, dan wordt een open regressie-issue gesloten.

on:
  schedule:
    - cron: '0 6 * * 1'   # elke maandag 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  seo-score:
    name: SEO Health Score
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Initial SEO scorecard
        run: node scripts/seo-scorecard.cjs --check-external

      - name: Self-heal when below 100
        run: |
          SCORE=$(node -e "console.log(require('./scripts/seo-scorecard-output.json').total)")
          echo "Initiële score: $SCORE/100"
          if [ "$SCORE" -lt 100 ]; then
            echo "Onder 100 — veilige auto-fixes toepassen"
            node scripts/seo-autofix.cjs --apply
            npm run build
            node scripts/seo-scorecard.cjs --check-external
            if ! git diff --quiet; then
              git config user.name "aanloop-seo-bot"
              git config user.email "seo-bot@aanloopai.nl"
              git add -A
              git commit -m "chore: SEO auto-heal — veilige fixes door weekly scorecard"
              git push
              echo "Auto-heal commit gepusht."
            else
              echo "Auto-fix leverde geen wijzigingen op."
            fi
          fi

      - name: Publish score summary
        run: |
          node -e "
            const d = require('./scripts/seo-scorecard-output.json');
            const fs = require('fs');
            let md = '## SEO Health Score: ' + d.total + '/100 — ' + d.grade + '\n\n';
            md += '| Categorie | Gewicht | Score |\n|---|---|---|\n';
            for (const c of d.categories) md += '| ' + c.key + ' | ' + c.weight + '% | ' + (c.score === null ? 'n/a' : c.score) + ' |\n';
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-scorecard
          path: |
            scripts/seo-scorecard-output.json
            scripts/seo-link-integrity-output.json
            scripts/seo-audit-output.json
            scripts/seo-orphan-output.json
          retention-days: 90

      - name: Open, update or close regression issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('scripts/seo-scorecard-output.json', 'utf8'));
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'seo-regression', per_page: 10,
            });

            if (d.total >= 100) {
              for (const iss of existing.data) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: iss.number,
                  body: 'SEO Health Score is terug op 100/100 — automatisch gesloten.',
                });
                await github.rest.issues.update({ owner, repo, issue_number: iss.number, state: 'closed' });
              }
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            const rows = d.categories.map((c) =>
              `| ${c.key} | ${c.weight}% | ${c.score == null ? 'n/a' : c.score} | ${c.detail} |`
            ).join('\n');
            const body = [
              `**SEO Health Score: ${d.total}/100 — ${d.grade}** (${today})`,
              '',
              'Auto-heal (veilige fixes) heeft de score niet tot 100 kunnen herstellen — handmatige actie nodig.',
              '',
              '| Categorie | Gewicht | Score | Detail |',
              '|---|---|---|---|',
              rows,
              '',
              'Draai lokaal `npm run seo:fix` voor de volledige actielijst en `npm run seo:score` om te verifiëren.',
            ].join('\n');
            const title = `[auto] SEO Health Score ${d.total}/100 — onder 100`;

            if (existing.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['seo-regression'] });
            }

      - name: Gate on 100
        run: |
          SCORE=$(node -e "console.log(require('./scripts/seo-scorecard-output.json').total)")
          if [ "$SCORE" -lt 100 ]; then
            echo "::error::SEO Health Score $SCORE/100 — onder 100. Zie het seo-regression issue en de samenvatting."
            exit 1
          fi
          echo "SEO Health Score $SCORE/100 — OK."
