name: Instagram Stories Auto-Publish

# Publishes the next due slot from marketing/instagram/wave-N-stories-schedule.json
# to @aanloop.ai via Meta Graph API. Daily 11:00 + 19:00 CET cadence,
# DST-safe via dual cron entries (CEST 11:00 = 09:00 UTC, CET 11:00 = 10:00 UTC;
# CEST 19:00 = 17:00 UTC, CET 19:00 = 18:00 UTC).
# Idempotent: each slot has posted_at and won't re-fire.

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Graph API calls (preview only)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  publish:
    name: Publish next IG story slot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ig-stories-publish
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run IG story publisher
        env:
          IG_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/ig-publish-story.mjs

      - name: Commit schedule update
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if git diff --quiet marketing/instagram/wave-*-stories-schedule.json; then
            echo "No stories schedule changes."
            exit 0
          fi
          git config user.name "aanloop-ig-bot"
          git config user.email "bot@aanloopai.nl"
          git add marketing/instagram/wave-*-stories-schedule.json
          git commit -m "chore(social): record IG story publish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin master

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ig-stories-publish-fail';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `IG stories publish workflow failed (run ${context.runId})`;
            const body = [
              `Run: ${runUrl}`,
              `Triggered by: ${context.eventName}`,
              ``,
              `Open the failed step ('Run IG story publisher') for verbose error JSON.`,
              ``,
              `Auto-opened by .github/workflows/ig-stories-publish.yml`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Failure again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
