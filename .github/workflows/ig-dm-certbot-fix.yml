name: IG DM Certbot Fix (one-shot)

on:
  workflow_dispatch:

  permissions:
    contents: read

    jobs:
      certbot-fix:
          name: Fix nginx + obtain TLS cert
              runs-on: ubuntu-latest
                  timeout-minutes: 10

                      steps:
                            - name: Setup SSH key
                                    env:
                                              HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
                                                        HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
                                                                run: |
                                                                          mkdir -p ~/.ssh
                                                                                    printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                                                                                              chmod 0600 ~/.ssh/id_ed25519
                                                                                                        ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
                                                                                                        
                                                                                                              - name: Fix nginx config + obtain TLS cert
                                                                                                                      env:
                                                                                                                                HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
                                                                                                                                          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
                                                                                                                                                  run: |
                                                                                                                                                            ssh -i ~/.ssh/id_ed25519 "${HETZNER_SSH_USER}@${HETZNER_HOST}" bash << 'ENDSSH'
                                                                                                                                                                      set -euo pipefail
                                                                                                                                                                                DOMAIN=ig-dm.aanloopai.nl
                                                                                                                                                                                
                                                                                                                                                                                          # Ensure webroot exists
                                                                                                                                                                                                    mkdir -p /var/www/letsencrypt
                                                                                                                                                                                                    
                                                                                                                                                                                                              # Write HTTP-only nginx config (no SSL — certbot needs port 80 first)
                                                                                                                                                                                                                        cat > /etc/nginx/sites-available/${DOMAIN} << 'NGINX'
                                                                                                                                                                                                                                  server {
                                                                                                                                                                                                                                                listen 80;
                                                                                                                                                                                                                                                              listen [::]:80;
                                                                                                                                                                                                                                                                            server_name ig-dm.aanloopai.nl;
                                                                                                                                                                                                                                                                                          location /.well-known/acme-challenge/ {
                                                                                                                                                                                                                                                                                                            root /var/www/letsencrypt;
                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                        location / {
                                                                                                                                                                                                                                                                                                                                                          return 301 https://$host$request_uri;
                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                            NGINX
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                      # Ensure symlink exists
                                                                                                                                                                                                                                                                                                                                                                                                                ln -sf /etc/nginx/sites-available/${DOMAIN} /etc/nginx/sites-enabled/${DOMAIN}
                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                          # Test and reload nginx with HTTP-only config
                                                                                                                                                                                                                                                                                                                                                                                                                                    nginx -t
                                                                                                                                                                                                                                                                                                                                                                                                                                              systemctl reload nginx
                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                        # Obtain TLS cert
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  certbot certonly --webroot -w /var/www/letsencrypt -d ${DOMAIN} \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              --non-interactive --agree-tos -m doganagahm@gmail.com
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # Now install full SSL nginx config
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cat > /etc/nginx/sites-available/${DOMAIN} << 'NGINX2'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            server {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          listen 80;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        listen [::]:80;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      server_name ig-dm.aanloopai.nl;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    location /.well-known/acme-challenge/ {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      root /var/www/letsencrypt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  location / {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return 301 https://$host$request_uri;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      server {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    listen 443 ssl;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  listen [::]:443 ssl;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                server_name ig-dm.aanloopai.nl;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ssl_certificate /etc/letsencrypt/live/ig-dm.aanloopai.nl/fullchain.pem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ssl_certificate_key /etc/letsencrypt/live/ig-dm.aanloopai.nl/privkey.pem;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ssl_protocols TLSv1.2 TLSv1.3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        location = /webhook {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          proxy_pass http://127.0.0.1:3030/webhook;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            proxy_http_version 1.1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              proxy_set_header Host $host;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                proxy_set_header X-Real-IP $remote_addr;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    proxy_set_header X-Forwarded-Proto https;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  location = /health {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    proxy_pass http://127.0.0.1:3030/health;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      proxy_set_header Host $host;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        access_log off;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    location / {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return 404;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        NGINX2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  nginx -t
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            systemctl reload nginx
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "Done! nginx now serving SSL on port 443."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ENDSSH
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Verify HTTPS is up
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        sleep 3
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  curl -fsSL --max-time 10 https://ig-dm.aanloopai.nl/health && echo "Health OK" || echo "Health check failed (bot may not be running yet)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
