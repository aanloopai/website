name: IG DM Certbot Fix (one-shot)

# Eenmalige herstelactie, laatst gedraaid 25 mei 2026: nginx herstellen en een
# TLS-certificaat aanvragen voor ig-dm.aanloopai.nl. Bewaard als referentie voor
# een volgende storing. Geen cron — alleen handmatig via workflow_dispatch.

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certbot-fix:
    name: Fix nginx + obtain TLS cert
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup SSH key
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${HETZNER_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${HETZNER_HOST}" >> ~/.ssh/known_hosts
      - name: Run certbot-fix on host
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/ig-dm/certbot-fix.sh root@${HETZNER_HOST}:/tmp/certbot-fix.sh
          scp -i ~/.ssh/id_ed25519 deploy/ig-dm/nginx.conf root@${HETZNER_HOST}:/tmp/ig-dm-nginx.conf
          ssh -i ~/.ssh/id_ed25519 root@${HETZNER_HOST} bash /tmp/certbot-fix.sh
      - name: Health check
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            if curl -sf https://ig-dm.aanloopai.nl/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check failed"
          exit 1
