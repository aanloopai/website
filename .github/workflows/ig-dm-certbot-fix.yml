name: IG DM Certbot Fix (one-shot)

on:
  workflow_dispatch:

  permissions:
    contents: read

    jobs:
      certbot-fix:
          name: Fix nginx + obtain TLS cert
              runs-on: ubuntu-latest
                  timeout-minutes: 10

                      steps:
                            - name: Setup SSH key
                                    env:
                                              HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
                                                        HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
                                                                run: |
                                                                          mkdir -p ~/.ssh
                                                                                    printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                                                                                              chmod 0600 ~/.ssh/id_ed25519
                                                                                                        ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
                                                                                                        
                                                                                                              - name: Write HTTP-only nginx config
                                                                                                                      env:
                                                                                                                                HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
                                                                                                                                          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
                                                                                                                                                  run: |
                                                                                                                                                            ssh -i ~/.ssh/id_ed25519 "${HETZNER_SSH_USER}@${HETZNER_HOST}" \
                                                                                                                                                                        "mkdir -p /var/www/letsencrypt && \
                                                                                                                                                                                    printf 'server {\n  listen 80;\n  listen [::]:80;\n  server_name ig-dm.aanloopai.nl;\n  location /.well-known/acme-challenge/ {\n    root /var/www/letsencrypt;\n  }\n  location / {\n    return 301 https://\$host\$request_uri;\n  }\n}\n' > /etc/nginx/sites-available/ig-dm.aanloopai.nl && \
                                                                                                                                                                                                ln -sf /etc/nginx/sites-available/ig-dm.aanloopai.nl /etc/nginx/sites-enabled/ig-dm.aanloopai.nl && \
                                                                                                                                                                                                            nginx -t && systemctl reload nginx"
                                                                                                                                                                                                            
                                                                                                                                                                                                                  - name: Obtain TLS certificate
                                                                                                                                                                                                                          env:
                                                                                                                                                                                                                                    HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
                                                                                                                                                                                                                                              HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                ssh -i ~/.ssh/id_ed25519 "${HETZNER_SSH_USER}@${HETZNER_HOST}" \
                                                                                                                                                                                                                                                                            "certbot certonly --webroot -w /var/www/letsencrypt -d ig-dm.aanloopai.nl \
                                                                                                                                                                                                                                                                                        --non-interactive --agree-tos -m doganagahm@gmail.com"
                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                              - name: Install SSL nginx config
                                                                                                                                                                                                                                                                                                      env:
                                                                                                                                                                                                                                                                                                                HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
                                                                                                                                                                                                                                                                                                                          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                            ssh -i ~/.ssh/id_ed25519 "${HETZNER_SSH_USER}@${HETZNER_HOST}" \
                                                                                                                                                                                                                                                                                                                                                        "install -m 0644 /opt/aanloop-ig-dm/deploy/ig-dm/nginx.conf /etc/nginx/sites-available/ig-dm.aanloopai.nl && \
                                                                                                                                                                                                                                                                                                                                                                    ln -sf /etc/nginx/sites-available/ig-dm.aanloopai.nl /etc/nginx/sites-enabled/ig-dm.aanloopai.nl && \
                                                                                                                                                                                                                                                                                                                                                                                nginx -t && systemctl reload nginx"
                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                      - name: Restart bot service
                                                                                                                                                                                                                                                                                                                                                                                              env:
                                                                                                                                                                                                                                                                                                                                                                                                        HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
                                                                                                                                                                                                                                                                                                                                                                                                                  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
                                                                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                    ssh -i ~/.ssh/id_ed25519 "${HETZNER_SSH_USER}@${HETZNER_HOST}" \
                                                                                                                                                                                                                                                                                                                                                                                                                                                "systemctl restart aanloop-ig-dm && systemctl is-active aanloop-ig-dm"
                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Verify HTTPS health
                                                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        sleep 5
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  curl -fsSL --max-time 10 https://ig-dm.aanloopai.nl/health && echo "Health OK" || echo "Health check failed"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
