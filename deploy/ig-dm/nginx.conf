server {
    listen 80;
    listen [::]:80;
    server_name ig-dm.aanloopai.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ig-dm.aanloopai.nl;

    ssl_certificate     /etc/letsencrypt/live/ig-dm.aanloopai.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ig-dm.aanloopai.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 256k;

    location = /webhook {
        proxy_pass http://127.0.0.1:3030/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3030/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 404;
    }
}
