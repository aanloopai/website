name = "website"
account_id = "c8e12a809a728ace4dda18079c725070"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
# Zonder run_worker_first serveert Workers Assets een statische pagina
# rechtstreeks, vóór de Worker draait. Gevolg (Ahrefs-audit 2026-08-24):
# http://aanloopai.nl/* gaf 200 OK i.p.v. een 301 naar https — de
# host/protocol-canonicalisatie bovenin fetch() werd nooit bereikt. Met deze
# regel draait de Worker op elk verzoek en is één 301 gegarandeerd.
run_worker_first = true
# Zonder deze regel beantwoordt Workers Assets een onbekend pad met een kale
# 404 zonder body: de bezoeker kreeg de browserfoutmelding te zien terwijl
# dist/404.html gewoon gebouwd werd. Nu wordt die pagina geserveerd, mét
# navigatie, en nog steeds met statuscode 404.
not_found_handling = "404-page"

# Google Calendar booking token store (/demo-inplannen/).
# Also reused by the customer portal for magic-link rate limiting (portal:rl:* keys).
[[kv_namespaces]]
binding = "GOOGLE_TOKENS"
id = "ffb342acce5544a8bb4ca8d93c0e9686"

# Customer portal database (C3). Created with: wrangler d1 create aanloop-portal
# Still required: wrangler secret put PORTAL_SESSION_SECRET
#   + apply migrations/0001_portal_schema.sql (see developing/portal/README.md).
[[d1_databases]]
binding = "PORTAL_DB"
database_name = "aanloop-portal"
database_id = "e7e0d9e9-3400-476b-bd27-ede26f6d41e1"

# Cron — reconcile stale Mollie payments every 15 minutes (V4 Sprint D).
[triggers]
crons = ["*/15 * * * *"]

# F1.3b intake wizard (aanloopai.nl/start -> POST /api/intake, src/worker.js
# handleIntake). D1 write always happens; the Hetzner forward below is
# best-effort and optional. Apply migrations/0014_intake_requests.sql first.
# Still required (secrets, never put values in this file):
#   wrangler secret put INTAKE_WEBHOOK_URL     (Hetzner/fleetclaw receiving endpoint)
#   wrangler secret put INTAKE_WEBHOOK_SECRET  (HMAC-SHA256 key for X-Intake-Signature)
# Without these two, /api/intake still stores every submission in D1
# (forwarded=0) and returns success to the browser — forward is simply skipped.
