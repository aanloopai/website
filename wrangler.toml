name = "website"
account_id = "c8e12a809a728ace4dda18079c725070"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# Google Calendar booking token store (/demo-inplannen/).
# Also reused by the customer portal for magic-link rate limiting (portal:rl:* keys).
[[kv_namespaces]]
binding = "GOOGLE_TOKENS"
id = "ffb342acce5544a8bb4ca8d93c0e9686"

# Customer portal database (C3). UNCOMMENT after creating the D1 database:
#   wrangler d1 create aanloop-portal
# then paste the printed database_id below. Until this is configured the
# portal routes return HTTP 503 and the rest of the site is unaffected.
# Also set the session secret:  wrangler secret put PORTAL_SESSION_SECRET
# See developing/portal/README.md for the full setup.
# [[d1_databases]]
# binding = "PORTAL_DB"
# database_name = "aanloop-portal"
# database_id = "PASTE_DATABASE_ID_HERE"
